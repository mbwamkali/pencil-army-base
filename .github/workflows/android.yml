name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Builds the Android test app from the same web build as the site.
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pencil-army-base-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pencil-army-base-test-apk
          path: pencil-army-base-test.apk
      # The newest test build from the port branch goes on one GitHub release, so the phone can download it from a fixed link.
      - name: Publish test build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/capacitor-port')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Test build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install on an Android phone; it updates the previous test build."
          if gh release view android-test >/dev/null 2>&1; then
            gh release edit android-test --notes "$notes"
          else
            gh release create android-test --prerelease --title "Android test build" --target "$GITHUB_SHA" --notes "$notes"
          fi
          gh release upload android-test pencil-army-base-test.apk --clobber
